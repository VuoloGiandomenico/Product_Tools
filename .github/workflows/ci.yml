name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (real errors only)
        # E9: syntax errors, F63/F7: invalid comparisons/statements, F821: undefined names
        run: ruff check . --select E9,F63,F7,F821 --exclude .merge_tmp
      - name: Dependency CVE audit
        run: pip-audit -r requirements.txt
      - name: Tests
        run: pytest --cov=utils --cov-branch --cov-report=term-missing

